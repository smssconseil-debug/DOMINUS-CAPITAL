name: Sync Google Sheets → trades.json

on:
  # Run automatically on a schedule (every day at 06:00 UTC)
  schedule:
    - cron: '0 6 * * *'

  # Allow triggering manually from the Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit & push trades.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch CSV and convert to JSON
        env:
          SHEETS_CSV_URL: ${{ secrets.SHEETS_CSV_URL }}
        run: node csv-to-json.js

      - name: Commit and push if trades.json changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/data/trades.json
          if git diff --cached --quiet; then
            echo "No changes — trades.json is already up to date."
          else
            git commit -m "chore(data): sync trades from Google Sheets [skip ci]"
            git push
          fi
